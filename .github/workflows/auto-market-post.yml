name: Auto Market Analysis Post

on:
  schedule:
    # 每天台北時間早上 9:00 執行 (UTC 1:00)
    - cron: '0 1 * * *'
    # 每天台北時間下午 3:00 執行 (UTC 7:00) 
    - cron: '0 7 * * *'
  workflow_dispatch: # 允許手動觸發

jobs:
  post-market-analysis:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Run market analysis and post
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        X_API_KEY: ${{ secrets.X_API_KEY }}
        X_API_SECRET: ${{ secrets.X_API_SECRET }}
        X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
        X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        AUTO_POST_TO_X: "true"
      run: |
        echo "開始執行市場分析..."
        # 檢查必要的環境變數是否存在
        if [ -z "$GEMINI_API_KEY" ]; then
          echo "❌ 錯誤: GEMINI_API_KEY 未設定"
          echo "請到 GitHub 儲存庫的 Settings > Secrets and variables > Actions 添加 GEMINI_API_KEY"
          exit 1
        fi
        
        echo "✅ 環境變數檢查完成"
        python main.py
        echo "市場分析完成！"